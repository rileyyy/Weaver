# Container port is 8080 (not 80) so it matches the dev image's Flutter web
# server port — the two never need different mental models, just different
# host-side port mappings in compose.

# Caddy terminates TLS in front of this server, so keep the scheme it saw
# (https) rather than this hop's own (http).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Flutter web output isn't content-hashed: main.dart.js, canvaskit/ and
# assets/ keep the same names across releases. Long-caching any of them
# could mix old and new files after a deploy, so every app file is
# revalidated (a cheap 304 via ETag). API responses keep their own headers.
map $uri $static_cache_control {
    ~^/(api|mcp)(/|$)  "";
    default            "no-cache";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Set once here with `always`: an add_header inside a location would
    # silently drop all of these for that location.
    add_header Cache-Control $static_cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CanvasKit is served locally (--no-web-resources-cdn) and needs
    # wasm-unsafe-eval to compile; Flutter injects inline styles; the engine
    # fetches Roboto/Noto fonts from fonts.gstatic.com.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The Flutter app calls the backend at a same-origin relative path in
    # production, so the built image works at whatever domain/IP the
    # self-hosted server is reachable at — no API URL needs to be baked in
    # at image build time.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # MCP clients reach the API through the same TLS endpoint as the app.
    # Streamable HTTP responses can be server-sent event streams, so don't
    # buffer them and allow long-lived reads.
    location /mcp {
        proxy_pass http://backend:8080/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
