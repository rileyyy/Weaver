name: weaver
description: "A swimlane focused kanban app"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  injectable: ^2.5.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.9.1

flutter:
  uses-material-design: true
