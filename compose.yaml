# Deployment definition: pulls pre-built images from GHCR (published by
# .github/workflows/docker-publish.yml) and runs them as-is — no source,
# no build step. This is what a self-hosted server runs:
#
#   docker compose pull && docker compose up -d
#
# For local development, `docker compose up` from this same directory picks
# up compose.override.yaml automatically (Compose's default merge behavior)
# and gets hot-reloading build-from-source containers instead. See
# agent_notes.md for the reasoning.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: weaver
      POSTGRES_USER: weaver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example) before starting}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weaver -d weaver"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .env (copy .env.example) before starting}:${WEAVER_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Weaver: Host=db;Port=5432;Database=weaver;Username=weaver;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example) before starting}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (copy .env.example) before starting}
      # The app is served same-origin through Caddy, so this only matters
      # for some other web origin calling the API directly.
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-https://${WEAVER_DOMAIN:-localhost}}
    healthcheck:
      # /health includes a database check; start_period covers migrations
      # applied at startup.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No published ports: the API (including /mcp) is only reachable through
    # Caddy -> nginx, so it always sits behind TLS.

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in .env (copy .env.example) before starting}:${WEAVER_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Terminates TLS for everything (app, /api, /mcp) and redirects HTTP to
  # HTTPS. --internal-certs issues the certificate from Caddy's own local
  # CA, for a LAN server with no public domain: each device must trust the
  # CA's root once (see README.md). WEAVER_DOMAIN is checked here rather
  # than with ${...:?} so local dev, which doesn't run Caddy, doesn't need it.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      WEAVER_DOMAIN: ${WEAVER_DOMAIN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$WEAVER_DOMAIN" ]; then
          echo "Set WEAVER_DOMAIN in .env (copy .env.example): the host name or IP clients use to reach this server." >&2
          exit 1
        fi
        exec caddy reverse-proxy --from "https://$$WEAVER_DOMAIN" --to frontend:8080 --internal-certs
    ports:
      - "${WEAVER_HTTP_PORT:-80}:80"
      - "${WEAVER_HTTPS_PORT:-443}:443"
    volumes:
      # Holds the local CA's keys; losing it means every device has to
      # trust a new root certificate.
      - caddy-data:/data

volumes:
  pgdata:
  caddy-data:
