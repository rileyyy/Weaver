# Local dev overlay. Compose loads this automatically alongside compose.yaml
# whenever you run `docker compose up` from this directory — no extra flag
# needed. It replaces the pulled images with containers built from source
# that bind-mount the working tree, so `dotnet watch` and Flutter's hot
# reload both see host edits immediately. See docs/development.md.
#
# Deploying to the self-hosted server should NOT pick this file up — don't
# copy it there, or run `docker compose -f compose.yaml ...` explicitly if
# it's present for some other reason.

services:
  db:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: weaver

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    image: weaver-backend:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Weaver: Host=db;Port=5432;Database=weaver;Username=weaver;Password=weaver
      # Dev-only placeholders — never reused in compose.yaml's prod path,
      # which requires real values via .env (see JWT_SIGNING_KEY/
      # CORS_ALLOWED_ORIGIN in .env.example).
      Jwt__SigningKey: insecure-development-only-signing-key-do-not-use-in-production
      Cors__AllowedOrigins__0: http://localhost:8082
    # compose.yaml keeps the API off the host; dev talks to it directly.
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/src
      - backend-nuget-cache:/root/.nuget/packages

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.dev
    image: weaver-frontend:dev
    ports:
      - "8082:8080"
    # The Flutter dev server doesn't need the API to be up, and the first
    # `dotnet watch` build can outlast the backend healthcheck.
    depends_on:
      backend:
        condition: service_started
    stdin_open: true
    tty: true
    environment:
      API_BASE_URL: http://localhost:8080
    volumes:
      - ./frontend:/app

  # Dev serves the app straight from the Flutter dev server on :8082, so
  # the TLS proxy isn't needed. A profile nobody activates keeps it off.
  caddy:
    profiles: ["production-only"]

  # Dev data is disposable; no need for nightly dumps.
  backup:
    profiles: ["production-only"]

volumes:
  backend-nuget-cache:
